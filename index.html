<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital - Romeo & Juliet</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        luxury: {
                            black: '#0a0a0a',
                            dark: '#121212',
                            card: '#181818',
                            border: '#2a2a2a',
                            light: '#f5f5f7'
                        }
                    },
                    letterSpacing: {
                        widest: '.25em',
                        ultra: '.4em',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f7;
            overflow-x: hidden;
        }
        
        /* Subtle Grid Pattern */
        .grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Glassmorphism Monochrome */
        .glass-card {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #666666;
        }

        /* Animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-white selection:text-black grid-pattern custom-scrollbar">

    <!-- AUDIO PLAYER -->
    <audio id="bg-music" loop preload="auto">
        <!-- 1. Berkas lagu lokal (pastikan file MP3 berada di folder yang sama) -->
        <source src="Ari Lasso - Cinta Terakhir Lirik HQ.mp3" type="audio/mpeg">
        <source src="Ari Lasso - Cinta Terakhir Lirik HQ.MP3" type="audio/mpeg">
        <!-- 2. Cadangan audio online jika file lokal tidak ditemukan -->
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-piano-115330.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <!-- MUSIC CONTROLLER BUTTON -->
    <div id="music-control" class="fixed bottom-6 right-6 z-40 transition-all duration-500 opacity-0 pointer-events-none transform translate-y-4">
        <button id="btn-toggle-music" class="group relative flex items-center justify-center w-14 h-14 bg-white text-black rounded-full shadow-2xl border border-white hover:scale-110 active:scale-95 transition-all duration-300">
            <i id="music-icon" class="fa-solid fa-compact-disc text-2xl animate-spin" style="animation-duration: 4s;"></i>
            <!-- Tooltip Info Song -->
            <span class="absolute right-16 bg-black/90 text-white border border-white/20 text-[10px] tracking-widest uppercase py-1 px-3 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                Ari Lasso - Cinta Terakhir
            </span>
        </button>
    </div>

    <!-- COVER PEMBUKA (FULLSCREEN OVERLAY) -->
    <div id="welcome-cover" class="fixed inset-0 z-50 bg-black flex flex-col justify-between items-center p-6 sm:p-10 text-center transition-all duration-1000 ease-in-out">
        <div class="mt-8 space-y-3">
            <p class="text-[11px] uppercase tracking-ultra text-gray-400 font-light">The Wedding Invitation Of</p>
            <h1 class="font-serif text-4xl sm:text-6xl font-bold tracking-widest text-white uppercase">Romeo <span class="font-extralight text-gray-500">&amp;</span> Juliet</h1>
            <div class="w-12 h-px bg-white/40 mx-auto my-2"></div>
            <p class="text-xs tracking-ultra text-gray-400">15 . 11 . 2026</p>
        </div>

        <!-- Central Image Frame -->
        <div class="relative my-6 w-60 sm:w-72 h-80 sm:h-96 border border-white/20 p-2 overflow-hidden shadow-2xl">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=800" alt="Romeo & Juliet" class="w-full h-full object-cover filter grayscale contrast-125 hover:scale-105 transition-transform duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
            <div class="absolute bottom-4 left-0 right-0 text-center px-4">
                <p class="text-[10px] uppercase tracking-widest text-gray-300 italic">"Cinta Terakhir - Ari Lasso"</p>
            </div>
        </div>

        <div class="mb-6 space-y-6 max-w-sm w-full">
            <div class="space-y-1">
                <p class="text-[11px] text-gray-400 tracking-wider">Kepada Yth. Bapak/Ibu/Saudara/i</p>
                <div class="py-2 border-y border-white/15">
                    <span id="guest-name-cover" class="text-base sm:text-lg font-medium tracking-wide text-white">Tamu Undangan</span>
                </div>
            </div>

            <button id="btn-open" class="w-full py-4 bg-white text-black font-bold tracking-widest text-xs uppercase hover:bg-gray-200 transition-all duration-300 flex items-center justify-center space-x-3 group shadow-xl">
                <i class="fa-solid fa-envelope-open text-sm transition-transform group-hover:-translate-y-0.5"></i>
                <span>Buka Undangan</span>
                <i class="fa-solid fa-arrow-right text-xs transition-transform duration-300 group-hover:translate-x-1"></i>
            </button>
        </div>
    </div>

    <!-- MAIN WRAPPER -->
    <main id="main-content" class="max-w-4xl mx-auto border-x border-white/10 bg-luxury-dark min-h-screen relative shadow-2xl">

        <!-- HERO SECTION -->
        <section id="hero" class="min-h-screen flex flex-col justify-center items-center text-center p-8 relative border-b border-white/10 overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.05)_0,transparent_70%)] animate-pulse-glow"></div>
            
            <div class="relative z-10 space-y-8">
                <span class="text-xs tracking-ultra uppercase text-gray-400 font-light block">We Are Getting Married</span>
                <h2 class="font-serif text-5xl sm:text-7xl font-bold tracking-widest text-white uppercase leading-tight">
                    Romeo<br>
                    <span class="text-3xl sm:text-4xl font-extralight text-gray-500">&amp;</span><br>
                    Juliet
  </h2>
